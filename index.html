<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora simples</title>
    <link rel="stylesheet" href=".//style.css">
    <script src=".//script.js" defer></script>
</head>
<body>
    <input id="numero1" type="text" placeholder="Digite um numero">
    <input id="numero2" type="text" placeholder="Digite outro numero">
    <button id="adicao">+</button>
    <button id="subtracao">-</button>
    <button id="multiplicacao">X</button>
    <button id="divisao">/</button>
    <hr>
    <div id="resultado"></div>
</body>
</html>
